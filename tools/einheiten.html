<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Einheiten – Offline-Ark</title>
  <meta name="color-scheme" content="light dark">
  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    [hidden] { display: none !important; }
    .seg.wrap { flex-wrap: wrap; }
    .seg.wrap button { flex: 1 1 30%; min-height: var(--hit); }
    .conv-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
    .conv-row .field { margin-bottom: 0; }
    .conv-row .btn { padding: 0 16px; }
    @media (max-width: 560px) { .conv-row { grid-template-columns: 1fr; } .conv-row .btn { width: 100%; } }
    input.big-input { font-size: 1.6rem; font-weight: 650; min-height: 60px; font-variant-numeric: tabular-nums; }
    #all td:first-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    #all tr.is-target td { background: var(--surface-2); }
    .result .num { word-break: break-word; }
  </style>
</head>
<body data-root="../" data-page="tool">
<main class="container">
  <header class="page-head">
    <h1>Einheiten</h1>
    <p class="lead">Länge, Gewicht, Volumen, Temperatur, Fläche, Geschwindigkeit, Energie.</p>
  </header>

  <div class="stack">
    <section class="card">
      <div class="field"><span class="label">Kategorie</span>
        <div class="seg wrap" data-local id="cats" role="group" aria-label="Kategorie"></div>
      </div>

      <div class="field"><label for="val">Wert</label>
        <input type="text" id="val" class="big-input" inputmode="decimal" autocomplete="off" value="1"></div>

      <div class="field" id="voltField" hidden><label for="volt">Spannung des Akkus in Volt (V)</label>
        <input type="text" id="volt" inputmode="decimal" autocomplete="off" value="3,7">
        <p class="hint">Handy, Powerbank, Kamera: meist 3,7 V. Die Angabe steht auf dem Akku.</p></div>

      <div class="conv-row">
        <div class="field"><label for="from">Von</label><select id="from"></select></div>
        <button type="button" class="btn" id="swap" aria-label="Einheiten tauschen">⇄ Tauschen</button>
        <div class="field"><label for="to">Nach</label><select id="to"></select></div>
      </div>
    </section>

    <section class="card result" aria-live="polite">
      <div><span class="num ltr" id="resNum">–</span><span class="unit" id="resUnit"></span></div>
      <div class="cap" id="resCap"></div>
    </section>

    <section class="card">
      <h2 style="margin-top:0;font-size:1.1rem">Alle Einheiten dieser Kategorie</h2>
      <div class="table-wrap"><table id="all"><tbody></tbody></table></div>
    </section>
  </div>
</main>
<script src="../js/icons.js"></script>
<script src="../js/common.js"></script>
<script src="../data/einheiten.js"></script>
<script src="../js/tool-einheiten.js"></script>
</body>
</html>
