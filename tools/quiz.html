<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiz – Offline-Ark</title>
  <meta name="color-scheme" content="light dark">
  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    [hidden] { display: none !important; }
    .cats { display: grid; gap: 10px; }
    .cat {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 64px; padding: 10px 18px;
      border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--text);
      font: inherit; text-align: start; cursor: pointer; box-shadow: var(--shadow); touch-action: manipulation;
    }
    .cat:active { transform: scale(.99); }
    .cat .name { font-weight: 650; font-size: 1.05rem; }
    .cat .sub { color: var(--text-2); font-size: .85rem; }

    .q-head { display: flex; justify-content: space-between; gap: 10px; color: var(--text-2); font-size: .9rem; margin-bottom: 8px; }
    .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-bottom: 18px; }
    .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
    .q-text { font-size: 1.3rem; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 16px; }
    .q-prompt { text-align: center; font: 700 2.2rem var(--font); letter-spacing: .1em; margin: 0 0 18px; padding: 14px; border-radius: var(--r); background: var(--surface-2); direction: ltr; }
    .answers { display: grid; gap: 10px; }
    .answer {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 16px; border: 0; border-radius: var(--r);
      background: var(--surface-2); color: var(--text); font: 500 1.02rem/1.3 var(--font); text-align: start; cursor: pointer; touch-action: manipulation;
    }
    .answer .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-size: .85rem; font-weight: 700; color: var(--text-2); }
    .answer[disabled] { cursor: default; }
    .answer.right { box-shadow: inset 0 0 0 3px var(--ok); }
    .answer.wrong { box-shadow: inset 0 0 0 3px var(--danger); }
    .feedback { margin-top: 16px; padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); }
    .feedback.ok { border: 2px solid var(--ok); }
    .feedback.bad { border: 2px solid var(--danger); }
    .feedback .head { font-weight: 700; margin-bottom: 4px; }
    .feedback p { margin: 0 0 8px; }
    .btn-row.center { justify-content: center; }
  </style>
</head>
<body data-root="../" data-page="tool">
<main class="container">
  <header class="page-head">
    <h1>Quiz</h1>
    <p class="lead">Teste dein Wissen: Erste Hilfe, Morse, Funkalphabet, Pflanzen, Wasser und Stromausfall.</p>
  </header>

  <!-- Auswahl -->
  <div class="stack" id="view-home">
    <button type="button" class="btn primary block" id="btn-mix" style="min-height:56px">Alles gemischt starten</button>
    <p class="section-title" style="margin:8px 4px 0">Oder wähle ein Thema</p>
    <div class="cats" id="cat-list"></div>
    <p class="hint">Jede Runde hat 10 Fragen. Nach jeder Antwort siehst du eine kurze Erklärung und einen Link zur passenden Seite.</p>
  </div>

  <!-- Frage -->
  <div class="stack" id="view-q" hidden>
    <section class="card">
      <div class="q-head"><span id="q-prog"></span><span id="q-cat"></span></div>
      <div class="bar" aria-hidden="true"><span id="q-bar"></span></div>
      <h2 class="q-text" id="q-text" style="margin-top:0"></h2>
      <div class="q-prompt" id="q-prompt" hidden></div>
      <div class="answers" id="q-answers" role="group" aria-label="Antworten"></div>
      <div class="feedback" id="q-feedback" role="status" hidden>
        <div class="head" id="fb-head"></div>
        <p id="fb-text"></p>
        <a id="fb-link" href="#"></a>
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button type="button" class="btn primary" id="btn-next" hidden>Weiter</button>
        <button type="button" class="btn sm" id="btn-quit">Quiz beenden</button>
      </div>
    </section>
  </div>

  <!-- Ergebnis -->
  <div class="stack" id="view-res" hidden>
    <section class="card result">
      <h2 id="res-title" style="margin-top:0"></h2>
      <div><span class="num ltr" id="res-num"></span></div>
      <p class="cap" id="res-msg" style="margin-top:12px"></p>
      <div class="btn-row center" style="margin-top:18px">
        <button type="button" class="btn" id="btn-retry" hidden>Falsche Fragen wiederholen</button>
        <button type="button" class="btn" id="btn-again">Neue Runde</button>
        <button type="button" class="btn" id="btn-back">Alle Themen</button>
      </div>
    </section>
  </div>
</main>
<script src="../js/icons.js"></script>
<script src="../js/common.js"></script>
<script src="../data/morse-table.js"></script>
<script src="../data/funk-alphabet.js"></script>
<script src="../data/quiz-fragen.js"></script>
<script src="../js/tool-quiz.js"></script>
</body>
</html>
