<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taschenrechner – Offline-Ark</title>
  <meta name="color-scheme" content="light dark">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .calc { max-width: 460px; margin: 0 auto; }
    .calc-display { text-align: right; padding: 6px 4px 14px; min-height: 108px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
    .calc-flags { display: flex; gap: 6px; justify-content: flex-start; min-height: 26px; }
    .calc-expr { color: var(--text-2); font-size: 1.05rem; min-height: 1.6em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .calc-out { font-size: clamp(2.2rem, 10vw, 3.1rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; min-height: 1.1em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .calc-out.dim { color: var(--text-2); }
    .calc-out.long { font-size: clamp(1.6rem, 7vw, 2.2rem); }
    .calc-out.err { color: var(--danger); font-size: 1.2rem; line-height: 1.3; letter-spacing: 0; }
    .calc-keys, .calc-sci { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .calc-sci[hidden], .chip[hidden], .btn[hidden] { display: none; }
    .calc-sci { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .calc-sci .seg { grid-column: 1 / -1; }
    .key {
      min-height: 60px; min-width: 56px; padding: 0 4px; border: 0; border-radius: 16px; cursor: pointer;
      font: 500 1.35rem var(--font); background: var(--surface-2); color: var(--text); touch-action: manipulation;
      transition: filter .1s, transform .05s;
    }
    .key:hover { filter: brightness(.96); }
    .key:active { transform: scale(.96); }
    .key.op { color: var(--accent); font-weight: 600; font-size: 1.6rem; }
    .key.fn { font-size: 1.05rem; min-height: 56px; }
    .key.eq { grid-column: span 3; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 1.7rem; }
    .key.eq:hover { background: var(--accent-press); filter: none; }
    .key.clear { color: var(--danger); font-weight: 600; }
    .calc-more { display: flex; justify-content: center; margin-bottom: 12px; }
    .hist-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; min-height: 48px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; cursor: pointer; text-align: left; }
    .hist-item:last-child { border-bottom: 0; }
    .hist-item span { overflow-wrap: anywhere; font-size: .95rem; }
    .hist-item strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .calc-hist { margin-top: 16px; }
    .calc-hist details { margin: 0; }
  </style>
</head>
<body data-root="../" data-page="tool">
<main class="container">
  <header class="page-head">
    <h1>Taschenrechner</h1>
    <p class="lead">Grundrechenarten, Klammern und Prozent. Mit „Mehr“ kommen Wurzel, Potenzen, Winkelfunktionen und Logarithmen dazu.</p>
  </header>

  <div class="calc">
    <section class="card" aria-label="Rechner">
      <div class="calc-display" aria-live="polite">
        <div class="calc-flags">
          <span class="chip" id="deg-chip">Grad</span>
          <span class="chip" id="mem-chip" hidden>M</span>
        </div>
        <div class="calc-expr" id="calc-expr">&nbsp;</div>
        <div class="calc-out" id="calc-out">0</div>
      </div>

      <div class="calc-more">
        <button type="button" class="btn sm" id="more-btn" aria-expanded="false" aria-controls="sci-panel">Mehr</button>
      </div>

      <div class="calc-sci" id="sci-panel" hidden>
        <div class="seg" id="angle" data-local role="group" aria-label="Winkeleinheit">
          <button type="button" data-v="deg" aria-pressed="true">Grad (°)</button>
          <button type="button" data-v="rad" aria-pressed="false">Bogenmaß (rad)</button>
        </div>
        <button type="button" class="key fn" data-k="fn:sin">sin</button>
        <button type="button" class="key fn" data-k="fn:cos">cos</button>
        <button type="button" class="key fn" data-k="fn:tan">tan</button>
        <button type="button" class="key fn" data-k="pi" aria-label="Pi">π</button>
        <button type="button" class="key fn" data-k="fn:sin⁻¹" aria-label="Arkussinus">sin⁻¹</button>
        <button type="button" class="key fn" data-k="fn:cos⁻¹" aria-label="Arkuskosinus">cos⁻¹</button>
        <button type="button" class="key fn" data-k="fn:tan⁻¹" aria-label="Arkustangens">tan⁻¹</button>
        <button type="button" class="key fn" data-k="e" aria-label="Eulersche Zahl">e</button>
        <button type="button" class="key fn" data-k="fn:ln">ln</button>
        <button type="button" class="key fn" data-k="fn:log">log</button>
        <button type="button" class="key fn" data-k="sqrt" aria-label="Quadratwurzel">√</button>
        <button type="button" class="key fn" data-k="sq" aria-label="Quadrat">x²</button>
        <button type="button" class="key fn" data-k="pow" aria-label="x hoch y">x<sup>y</sup></button>
        <button type="button" class="key fn" data-k="inv" aria-label="Kehrwert">1/x</button>
        <button type="button" class="key fn" data-k="fact" aria-label="Fakultät">n!</button>
        <button type="button" class="key fn" data-k="ans" aria-label="Letztes Ergebnis">Ans</button>
        <button type="button" class="key fn" data-k="mc" aria-label="Speicher löschen">MC</button>
        <button type="button" class="key fn" data-k="mplus" aria-label="Zum Speicher addieren">M+</button>
        <button type="button" class="key fn" data-k="mminus" aria-label="Vom Speicher abziehen">M−</button>
        <button type="button" class="key fn" data-k="mr" aria-label="Speicher abrufen">MR</button>
      </div>

      <div class="calc-keys" id="calc-keys">
        <button type="button" class="key clear" data-k="clear" aria-label="Alles löschen">C</button>
        <button type="button" class="key op" data-k="open" aria-label="Klammer auf">(</button>
        <button type="button" class="key op" data-k="close" aria-label="Klammer zu">)</button>
        <button type="button" class="key op" data-k="back" aria-label="Letztes Zeichen löschen">⌫</button>
        <button type="button" class="key" data-k="7">7</button>
        <button type="button" class="key" data-k="8">8</button>
        <button type="button" class="key" data-k="9">9</button>
        <button type="button" class="key op" data-k="÷" aria-label="geteilt">÷</button>
        <button type="button" class="key" data-k="4">4</button>
        <button type="button" class="key" data-k="5">5</button>
        <button type="button" class="key" data-k="6">6</button>
        <button type="button" class="key op" data-k="×" aria-label="mal">×</button>
        <button type="button" class="key" data-k="1">1</button>
        <button type="button" class="key" data-k="2">2</button>
        <button type="button" class="key" data-k="3">3</button>
        <button type="button" class="key op" data-k="−" aria-label="minus">−</button>
        <button type="button" class="key" data-k="0">0</button>
        <button type="button" class="key" data-k="comma" aria-label="Komma">,</button>
        <button type="button" class="key op" data-k="pct" aria-label="Prozent">%</button>
        <button type="button" class="key op" data-k="+" aria-label="plus">+</button>
        <button type="button" class="key op" data-k="neg" aria-label="Vorzeichen wechseln">±</button>
        <button type="button" class="key eq" data-k="eq" aria-label="Ergebnis berechnen">=</button>
      </div>
    </section>

    <section class="calc-hist no-print">
      <details>
        <summary>Verlauf</summary>
        <div>
          <div id="hist-list"></div>
          <div class="btn-row" style="margin-top:8px"><button type="button" class="btn sm" id="hist-clear" hidden>Verlauf löschen</button></div>
        </div>
      </details>
    </section>

    <p class="hint center">Am PC geht auch die Tastatur: Zahlen, + − * / ( ) , %, Enter für „=“, Rücktaste zum Löschen, Esc für „C“.</p>
  </div>
</main>
<script src="../js/icons.js"></script>
<script src="../js/common.js"></script>
<script src="../js/tool-taschenrechner.js"></script>
</body>
</html>
