<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline-Ark – Notfallwissen ohne Internet</title>
  <meta name="description" content="Notfallwissen und Werkzeuge, die komplett ohne Internet funktionieren.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230071e3' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 15l2 4h14l2-4zM12 15V6M12 6l5 4h-5M7 15V12h10v3'/%3E%3C/svg%3E">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="" data-page="home">

<main class="container">
  <section class="hero">
    <h1>Wissen, wenn nichts mehr geht.</h1>
    <p>Läuft komplett ohne Internet – auf PC, Laptop und Handy.</p>

    <div class="search" id="suche">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="Suchen, z. B. Wasser, Blutung, Akku" autocomplete="off" aria-label="Suche in Werkzeugen und Wissen">
    </div>
    <div class="results" id="results" role="listbox" aria-live="polite"></div>

    <div class="statusbar" aria-label="Datum, Uhrzeit und Akku">
      <span class="clock" id="clock">--:--</span>
      <span id="date">&nbsp;</span>
      <span id="battery" hidden>Akku <strong id="batval"></strong></span>
    </div>
  </section>

  <h2 class="section-title" style="margin-top:28px">Notfall</h2>
  <div class="emergency" id="emergency">
    <a class="sos-tile" href="wissen/erste-hilfe.html"><span class="dot" id="ic-aid"></span><span>Erste Hilfe<small>Sofort-Maßnahmen</small></span></a>
    <a class="sos-tile" href="wissen/stromausfall.html"><span class="dot" id="ic-power"></span><span>Stromausfall<small>Was jetzt zu tun ist</small></span></a>
    <a class="sos-tile" href="wissen/wasser.html"><span class="dot" id="ic-water"></span><span>Wasser<small>Finden &amp; aufbereiten</small></span></a>
  </div>
  <p class="call112" data-t>Notruf <strong>112</strong> – bei Netzproblemen mehrfach versuchen, auch ohne Empfang im eigenen Netz.</p>

  <div id="tool-groups"></div>

  <h2 class="section-title">Wissen</h2>
  <nav class="list" id="wissen-list" aria-label="Wissensseiten"></nav>
</main>

<script src="data/tools.js"></script>
<script src="data/search-index.js"></script>
<script src="js/icons.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
